<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke" /></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b45"/></marker></defs>
<rect width="794" height="1123" fill="#fff"/>
<text x="397" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Request sequence</text>
<text x="397" y="74" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">What happens, in order</text>
<rect x="40" y="100" width="140" height="46" rx="10" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
<text x="110.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">iOS / Android</text>
<text x="110.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">app</text>
<line x1="110" y1="146" x2="110" y2="1000" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="222" y="100" width="140" height="46" rx="10" fill="#fff7e6" stroke="#c98a1b" stroke-width="1.5"/>
<text x="292.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Our server</text>
<text x="292.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">Node + Express</text>
<line x1="292" y1="146" x2="292" y2="1000" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="404" y="100" width="140" height="46" rx="10" fill="#e8f1ff" stroke="#2f6fdb" stroke-width="1.5"/>
<text x="474.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">CloudConvert</text>
<text x="474.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">online, first</text>
<line x1="474" y1="146" x2="474" y2="1000" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="586" y="100" width="140" height="46" rx="10" fill="#e9f7ec" stroke="#2e8b45" stroke-width="1.5"/>
<text x="656.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">LibreOffice</text>
<text x="656.0" y="131.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">our server, backup</text>
<line x1="656" y1="146" x2="656" y2="1000" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="110" y1="190" x2="292" y2="190" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="201.0" y="184" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">POST /convert (file)</text>
<rect x="212" y="208" width="160" height="32" rx="6" fill="#fff7e6" stroke="#c98a1b"/><text x="292" y="222" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">check key, size, type,</text>
<text x="292" y="235" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">and real content</text>
<rect x="60" y="262" width="674" height="136" rx="8" fill="#f2f8ff" stroke="#2f6fdb" stroke-dasharray="6 4"/><text x="72" y="280" text-anchor="start" font-size="12" font-weight="bold" fill="#2f6fdb">Normal: CloudConvert works</text>
<line x1="292" y1="310" x2="474" y2="310" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="383.0" y="304" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">create job, upload file</text>
<line x1="474" y1="346" x2="292" y2="346" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
<text x="383.0" y="340" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">PDF ready (download)</text>
<line x1="292" y1="382" x2="474" y2="382" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="383.0" y="376" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">delete the job</text>
<rect x="60" y="418" width="674" height="196" rx="8" fill="#fff4f3" stroke="#b3261e" stroke-dasharray="6 4"/><text x="72" y="436" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">Fallback: CloudConvert fails, is slow (45 s), or no key</text>
<line x1="292" y1="470" x2="474" y2="470" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="383.0" y="464" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">create job, upload file</text>
<line x1="474" y1="506" x2="292" y2="506" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="383.0" y="500" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b3261e">error or timeout</text>
<line x1="292" y1="552" x2="656" y2="552" stroke="#444" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="474.0" y="546" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">convert locally (max 60 s)</text>
<line x1="656" y1="590" x2="292" y2="590" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
<text x="474.0" y="584" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#333">PDF</text>
<rect x="212" y="640" width="160" height="32" rx="6" fill="#f3eefb" stroke="#7a4fc0"/><text x="292" y="654" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">delete temp files</text>
<text x="292" y="667" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#444">on our server</text>
<line x1="292" y1="706" x2="110" y2="706" stroke="#2e8b45" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="201" y="698" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2e8b45">200 OK + PDF</text>
<text x="201" y="722" text-anchor="middle" font-size="10" font-weight="normal" fill="#555">header X-Converted-By</text>
<rect x="40" y="740" width="140" height="32" rx="6" fill="#eef2f7" stroke="#5b6b82"/><text x="110" y="760" text-anchor="middle" font-size="11" font-weight="normal" fill="#444">shows the PDF</text>
<text x="60" y="840" text-anchor="start" font-size="15" font-weight="bold" fill="#1a1a1a">Reading the diagram</text>
<line x1="60" y1="848" x2="734" y2="848" stroke="#ccc"/>
<text x="60" y="868" text-anchor="start" font-size="12" font-weight="normal" fill="#444">Solid arrow = a request.  Dashed arrow = an answer.  Blue box = normal path.  Red box = fallback path.</text>
<text x="60" y="890" text-anchor="start" font-size="12" font-weight="normal" fill="#444">If both engines fail, the app gets a JSON error: 422 (broken file), 503 (LibreOffice busy), 504 (too slow).</text>
<text x="60" y="912" text-anchor="start" font-size="12" font-weight="normal" fill="#444">The app never chooses the engine. The server decides.</text>
</svg>
